<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack A Mole Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
  <h1>🔨 Whack A Mole</h1>

  <div class="info">
    <h2>Score: <span id="score">0</span></h2>
    <h2>Time: <span id="time">20</span>s</h2>
  </div>

  <div class="grid">
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
    <div class="hole"></div>
  </div>

  <p id="message">Hit the mole! 🎯</p>

  <button id="restartBtn">🔄 Restart Game</button>
</div>

<script src="script.js"></script>

</body>
</html>
